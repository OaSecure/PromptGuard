<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChatGPT-like Fixture</title>
  </head>
  <body>
    <main>
      <section id="conversation">
        <article>Earlier message</article>
        <article>Another long conversation item</article>
        <div
          data-testid="history-attachment-chip"
          data-promptguard-attachment-chip
          data-promptguard-extension=".zip"
          data-promptguard-mime="application/zip"
          data-promptguard-size-bytes="777"
        >
          stale-history.zip
        </div>
      </section>
      <form id="composer">
        <textarea id="prompt-textarea" aria-label="Prompt" rows="4"></textarea>
        <div id="contenteditable-prompt" contenteditable="true" aria-label="Prompt editor"></div>
        <div
          data-testid="attachment-chip"
          data-promptguard-attachment-chip
          data-promptguard-extension=".png"
          data-promptguard-mime="image/png"
          data-promptguard-size-bytes="2048"
          data-promptguard-attachment-kind="image"
        >
          customer-secret.png
        </div>
        <input id="file-input" type="file" multiple />
        <div data-testid="drop-zone">Drop files here</div>
        <button type="submit" data-testid="send-button">Send</button>
      </form>
    </main>
    <script>
      window.fixtureSubmits = 0;
      const composer = document.querySelector("#composer");
      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        window.fixtureSubmits += 1;
      });
    </script>
  </body>
</html>
