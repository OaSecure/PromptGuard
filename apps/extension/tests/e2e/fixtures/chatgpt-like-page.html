<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChatGPT-like Fixture</title>
  </head>
  <body>
    <main>
      <section id="conversation">
        <article>Earlier message</article>
        <article>Another long conversation item</article>
      </section>
      <form id="composer">
        <textarea id="prompt-textarea" aria-label="Prompt" rows="4"></textarea>
        <div id="contenteditable-prompt" contenteditable="true" aria-label="Prompt editor"></div>
        <input id="file-input" type="file" multiple />
        <div data-testid="drop-zone">Drop files here</div>
        <button type="submit" data-testid="send-button">Send</button>
      </form>
      <button id="rerender" type="button">Re-render</button>
    </main>
    <script>
      window.fixtureSubmits = 0;
      const composer = document.querySelector("#composer");
      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        window.fixtureSubmits += 1;
      });
      document.querySelector("#rerender").addEventListener("click", () => {
        document.querySelector("#prompt-textarea").remove();
        document.querySelector("[data-testid='send-button']").remove();

        const replacementInput = document.createElement("textarea");
        replacementInput.id = "prompt-textarea-rerendered";
        replacementInput.setAttribute("aria-label", "Prompt");
        replacementInput.rows = 4;

        const replacementButton = document.createElement("button");
        replacementButton.type = "submit";
        replacementButton.dataset.testid = "send-button";
        replacementButton.textContent = "Send";

        composer.prepend(replacementInput);
        composer.append(replacementButton);
      });
    </script>
  </body>
</html>
