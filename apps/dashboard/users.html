<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OASecure 사용자 관리</title>
    <link rel="stylesheet" href="./static/main.css" />
  </head>
  <body class="dashboard-auth-pending">
    <header class="admin-header">
      <div>
        <p class="eyebrow">OASecure User Management</p>
        <h1>사용자 관리</h1>
        <p class="header-desc">관리자 화면에서 사용자 상태와 권한을 확인합니다.</p>
      </div>
      <nav class="header-actions">
        <a href="./overview.html" class="nav-button">대시보드</a>
        <a href="./events.html" class="nav-button">이벤트 관리</a>
        <a href="./filters.html" class="nav-button">필터 관리</a>
        <a href="./status.html" class="nav-button">서버 상태</a>
        <a href="./login.html" class="logout-button">로그아웃</a>
      </nav>
    </header>
    <main class="dashboard">
      <section class="table-section">
        <div class="section-title-wrap">
          <div>
            <h2>사용자 목록</h2>
            <p>사용자 목록, 권한, 상태, 사용자별 이벤트 통계를 확인합니다.</p>
          </div>
        </div>
        <div id="users-message" class="privacy-note" role="status" aria-live="polite">사용자 정보를 불러오는 중입니다.</div>
        <div class="table-card users-form-card">
          <form id="create-user-form" class="users-form">
            <label>
              <span>로그인 ID</span>
              <input type="text" name="login_id" autocomplete="off" required />
            </label>
            <label>
              <span>사용자 이름</span>
              <input type="text" name="username" autocomplete="off" required />
            </label>
            <label>
              <span>부서</span>
              <input type="text" name="department" autocomplete="off" />
            </label>
            <label>
              <span>초기 비밀번호</span>
              <input type="password" name="password" autocomplete="new-password" required />
            </label>
            <label>
              <span>권한</span>
              <select name="role">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </label>
            <button id="create-user-submit" type="submit" class="users-primary-button">사용자 생성</button>
          </form>
        </div>
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>로그인 ID</th>
                <th>사용자 이름</th>
                <th>부서</th>
                <th>권한</th>
                <th>상태</th>
                <th>마지막 로그인 시간</th>
                <th>마지막 이벤트 시간</th>
                <th>생성일</th>
                <th>이벤트 수</th>
                <th>차단</th>
                <th>마스킹</th>
                <th>경고</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="./static/users.js"></script>
  </body>
</html>
