<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OASecure 이벤트 관리</title>
    <link rel="stylesheet" href="./static/main.css" />
  </head>
  <body>
    <header class="admin-header">
      <div>
        <p class="eyebrow">OASecure Event Monitoring</p>
        <h1>이벤트 관리</h1>
        <p class="header-desc">원문 프롬프트를 저장하지 않고 metadata-only 이벤트 정보만 표시합니다.</p>
      </div>
      <nav class="header-actions">
        <a href="./overview.html" class="nav-button">Overview</a>
        <a href="./events.html" class="nav-button">Events</a>
        <a href="./users.html" class="nav-button">Users</a>
        <a href="./filters.html" class="nav-button">Filters</a>
        <a href="./status.html" class="nav-button">Server Status</a>
        <a href="./login.html" class="logout-button">Logout</a>
      </nav>
    </header>
    <main class="dashboard">
      <section class="table-section">
        <div class="section-title-wrap">
          <div>
            <h2>Events</h2>
            <p>탐지 결과, 입력 개수, content unavailable 개수 같은 안전한 메타데이터만 표시합니다.</p>
          </div>
        </div>
        <div id="events-message" class="privacy-note" role="status" aria-live="polite">이벤트 목록을 불러오는 중입니다.</div>
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>시간</th>
                <th>사용자</th>
                <th>서비스</th>
                <th>Action</th>
                <th>위험도</th>
                <th>탐지 유형</th>
                <th>입력 개수</th>
                <th>Content unavailable</th>
              </tr>
            </thead>
            <tbody id="events-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="./static/events.js"></script>
  </body>
</html>
