services:
  api:
    build:
      context: ./apps/api
      additional_contexts:
        dashboard: ./apps/dashboard
    environment:
      PROMPTGUARD_ENV: ${PROMPTGUARD_ENV:-development}
      PROMPTGUARD_API_HOST: ${PROMPTGUARD_API_HOST:-0.0.0.0}
      PROMPTGUARD_API_PORT: ${PROMPTGUARD_API_PORT:-8000}
      PROMPTGUARD_API_PUBLIC_URL: ${PROMPTGUARD_API_PUBLIC_URL:-http://localhost:8000}
      PROMPTGUARD_EXTENSION_API_URL: ${PROMPTGUARD_EXTENSION_API_URL:-}
      PROMPTGUARD_DASHBOARD_PUBLIC_URL: ${PROMPTGUARD_DASHBOARD_PUBLIC_URL:-}
      PROMPTGUARD_DASHBOARD_STATIC_DIR: ${PROMPTGUARD_DASHBOARD_STATIC_DIR:-/opt/promptguard/dashboard}
      PROMPTGUARD_CORS_ORIGINS: ${PROMPTGUARD_CORS_ORIGINS:-http://localhost:8000,chrome-extension://placeholder}
      PROMPTGUARD_INITIAL_ADMIN_PASSWORD: ${PROMPTGUARD_INITIAL_ADMIN_PASSWORD:-1234}
      PROMPTGUARD_TEMP_FILE_ENCRYPTION_KEY: ${PROMPTGUARD_TEMP_FILE_ENCRYPTION_KEY:-}
      PROMPTGUARD_TEMP_FILE_DIR: ${PROMPTGUARD_TEMP_FILE_DIR:-.promptguard-temp}
      PROMPTGUARD_TEMP_FILE_TTL_SECONDS: ${PROMPTGUARD_TEMP_FILE_TTL_SECONDS:-900}
      PROMPTGUARD_TEMP_FILE_MAX_BYTES: ${PROMPTGUARD_TEMP_FILE_MAX_BYTES:-1048576}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://promptguard:promptguard_dev_password@postgres:5432/promptguard}
      REDIS_URL: ${REDIS_URL:-}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-change-me-access-token-secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-me-refresh-token-secret}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-change-me-dashboard-session-secret}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES:-15}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      DASHBOARD_SESSION_EXPIRES_HOURS: ${DASHBOARD_SESSION_EXPIRES_HOURS:-12}
      DASHBOARD_SESSION_COOKIE_NAME: ${DASHBOARD_SESSION_COOKIE_NAME:-promptguard_dashboard_session}
      DASHBOARD_CSRF_COOKIE_NAME: ${DASHBOARD_CSRF_COOKIE_NAME:-promptguard_dashboard_csrf}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      DASHBOARD_COOKIE_SAMESITE: ${DASHBOARD_COOKIE_SAMESITE:-lax}
      PROMPTGUARD_CLASSIFIER_RUNTIME_ENABLED: ${PROMPTGUARD_CLASSIFIER_RUNTIME_ENABLED:-false}
      PROMPTGUARD_CLASSIFIER_MANIFEST_PATH: ${PROMPTGUARD_CLASSIFIER_MANIFEST_PATH:-}
      PROMPTGUARD_VERIFIER_RUNTIME_ENABLED: ${PROMPTGUARD_VERIFIER_RUNTIME_ENABLED:-false}
      PROMPTGUARD_VERIFIER_MANIFEST_PATH: ${PROMPTGUARD_VERIFIER_MANIFEST_PATH:-}
      PROMPTGUARD_TORCH_WORKER_PAYLOAD_DIR: ${PROMPTGUARD_TORCH_WORKER_PAYLOAD_DIR:-/tmp/promptguard-torch-payloads}
      PROMPTGUARD_TORCH_WORKER_PYTHON_PATH: ${PROMPTGUARD_TORCH_WORKER_PYTHON_PATH:-/opt/venvs/torch/bin/python}
      PROMPTGUARD_TORCH_WORKER_SCRIPT_PATH: ${PROMPTGUARD_TORCH_WORKER_SCRIPT_PATH:-/app/scripts/torch_context_worker.py}
      PROMPTGUARD_PADDLE_WORKER_PAYLOAD_DIR: ${PROMPTGUARD_PADDLE_WORKER_PAYLOAD_DIR:-/tmp/promptguard-paddle-payloads}
      PROMPTGUARD_PADDLE_WORKER_PYTHON_PATH: ${PROMPTGUARD_PADDLE_WORKER_PYTHON_PATH:-/opt/venvs/paddle/bin/python}
      PROMPTGUARD_PADDLE_WORKER_SCRIPT_PATH: ${PROMPTGUARD_PADDLE_WORKER_SCRIPT_PATH:-/app/scripts/paddle_ocr_worker.py}
    ports:
      - "${PROMPTGUARD_API_PORT:-8000}:${PROMPTGUARD_API_PORT:-8000}"
    gpus: all
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./models:/opt/promptguard/models:ro
    command: /bin/sh /app/scripts/start_api.sh

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promptguard}
      POSTGRES_USER: ${POSTGRES_USER:-promptguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promptguard_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - promptguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptguard} -d ${POSTGRES_DB:-promptguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "6379:6379"
    volumes:
      - promptguard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  promptguard_postgres_data:
  promptguard_redis_data:
