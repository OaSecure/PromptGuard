name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install extension dependencies
        working-directory: apps/extension
        run: npm ci

      - name: Typecheck extension
        working-directory: apps/extension
        run: npm run typecheck

      - name: Test extension
        working-directory: apps/extension
        run: npm test

      - name: Build extension
        working-directory: apps/extension
        run: npm run build

      - name: Run extension contract checks
        run: python apps/extension/tests/run_extension_checks.py all

  backend-python:
    name: Backend Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: promptguard
          POSTGRES_USER: promptguard
          POSTGRES_PASSWORD: promptguard_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptguard -d promptguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: postgresql+asyncpg://promptguard:promptguard_dev_password@localhost:5432/promptguard
      REDIS_URL: ""
      PROMPTGUARD_INITIAL_ADMIN_PASSWORD: ci-initial-admin-password
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      ACCESS_TOKEN_EXPIRES_MINUTES: "15"
      REFRESH_TOKEN_EXPIRES_DAYS: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend
        id: backend
        run: |
          if [ -d apps/api ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "apps/api not present; skipping backend checks."
          fi

      - name: Set up Python
        if: steps.backend.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        if: steps.backend.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd apps/api
          python -m pip install --upgrade pip
          python -m pip install pytest

          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ ! -f pyproject.toml ] && [ ! -f requirements.txt ]; then
            echo "apps/api exists, but neither pyproject.toml nor requirements.txt exists." >&2
            exit 1
          fi

      - name: Lint backend with Ruff when configured
        if: steps.backend.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd apps/api
          if grep -RqsE '^\[tool\.ruff\]|ruff' pyproject.toml ruff.toml .ruff.toml setup.cfg tox.ini 2>/dev/null; then
            python -m pip install ruff
            python -m ruff check .
          else
            echo "No Ruff configuration found; skipping Ruff."
          fi

      - name: Typecheck backend with mypy when configured
        if: steps.backend.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd apps/api
          if grep -RqsE '^\[tool\.mypy\]|\[mypy\]' pyproject.toml mypy.ini setup.cfg tox.ini 2>/dev/null; then
            python -m pip install mypy
            python -m mypy .
          else
            echo "No mypy configuration found; skipping mypy."
          fi

      - name: Test backend
        if: steps.backend.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd apps/api
          if [ ! -d tests ]; then
            echo "apps/api exists, but apps/api/tests is missing." >&2
            exit 1
          fi
          python -m pytest

      - name: Validate backend migrations
        if: steps.backend.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd apps/api
          alembic upgrade head

  dashboard-ts:
    name: Dashboard TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect dashboard
        id: dashboard
        run: |
          if [ -f apps/dashboard/package.json ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "apps/dashboard/package.json not present; skipping dashboard checks."
          fi

      - name: Set up Node
        if: steps.dashboard.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        if: steps.dashboard.outputs.exists == 'true'
        working-directory: apps/dashboard
        run: npm ci

      - name: Run dashboard checks
        if: steps.dashboard.outputs.exists == 'true'
        working-directory: apps/dashboard
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const scripts = pkg.scripts || {};
          const required = ["typecheck", "test", "build"];
          const present = required.filter((name) => Boolean(scripts[name]));

          if (present.length === 0) {
            console.error("apps/dashboard/package.json exists, but none of typecheck/test/build scripts exist.");
            process.exit(1);
          }

          fs.writeFileSync(".ci-scripts", present.join("\n"));
          NODE

          while IFS= read -r script; do
            echo "Running dashboard script: ${script}"
            npm run "${script}"
          done < .ci-scripts

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect compose files
        id: compose
        run: |
          found=false
          for file in compose.yaml compose.yml docker-compose.yml infra/compose.yaml infra/compose.yml infra/docker-compose.yml; do
            if [ -f "$file" ]; then
              found=true
            fi
          done
          echo "exists=${found}" >> "${GITHUB_OUTPUT}"
          if [ "${found}" != "true" ]; then
            echo "No Docker Compose files present; skipping Docker smoke checks."
          fi

      - name: Validate Docker Compose configuration
        if: steps.compose.outputs.exists == 'true'
        run: |
          set -euo pipefail
          for file in compose.yaml compose.yml docker-compose.yml infra/compose.yaml infra/compose.yml infra/docker-compose.yml; do
            if [ -f "$file" ]; then
              echo "Validating ${file}"
              docker compose -f "$file" config
            fi
          done

      - name: Run API migration startup smoke
        if: steps.compose.outputs.exists == 'true'
        env:
          PROMPTGUARD_INITIAL_ADMIN_PASSWORD: ci-initial-admin-password
          ACCESS_TOKEN_SECRET: ci-access-token-secret
          REFRESH_TOKEN_SECRET: ci-refresh-token-secret
        run: |
          set -euo pipefail
          docker compose -f compose.yml down -v --remove-orphans
          docker compose -f compose.yml up --build -d api

          for attempt in {1..60}; do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker compose -f compose.yml logs api
              exit 1
            fi
            sleep 2
          done

          docker compose -f compose.yml exec -T api alembic current
          docker compose -f compose.yml exec -T api pytest tests/test_migration_runner.py -q
          docker compose -f compose.yml restart api

          for attempt in {1..60}; do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              docker compose -f compose.yml logs api
              exit 1
            fi
            sleep 2
          done

          docker compose -f compose.yml exec -T api pytest tests/test_migration_runner.py -q

      - name: Stop Docker Compose services
        if: always() && steps.compose.outputs.exists == 'true'
        run: docker compose -f compose.yml down -v --remove-orphans
