<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OASecure 사용자 관리</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>

    <header class="admin-header">
        <div>
            <p class="eyebrow">OASecure User Management</p>
            <h1>사용자 관리</h1>
            <p class="header-desc">
                조직 내 사용자의 권한, 상태, 마지막 접속일을 확인합니다.
            </p>
        </div>

        <nav class="header-actions">
            <a href="/admin" class="nav-button">대시보드</a>
            <a href="/events" class="nav-button">이벤트 관리</a>
            <a href="/logout" class="logout-button">로그아웃</a>
        </nav>
    </header>

    <main class="dashboard">
        <section class="table-section">
            <div class="section-title-wrap">
                <div>
                    <h2>User List</h2>
                    <p>사용자 계정, 역할, 상태 정보를 관리합니다.</p>
                </div>
            </div>

            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>사용자명</th>
                            <th>이메일</th>
                            <th>역할</th>
                            <th>상태</th>
                            <th>마지막 접속일</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in user_list %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.username }}</td>
                            <td>{{ user.email }}</td>
                            <td>
                                <span class="role-badge role-{{ user.role | lower }}">
                                    {{ user.role }}
                                </span>
                            </td>
                            <td>
                                <span class="user-status status-{{ user.status | lower }}">
                                    {{ user.status }}
                                </span>
                            </td>
                            <td>{{ user.last_login }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </main>

</body>
</html>
