<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OASecure 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="login-page">
        <section class="login-card">
            <h1 class="login-title">로그인</h1>

            <p class="login-description">
                OASecure 계정으로 로그인하세요.
            </p>

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <form action="/login" method="POST" class="login-form">
                <input 
                    type="text" 
                    name="username" 
                    class="login-input"
                    placeholder="아이디" 
                    required
                >

                <input 
                    type="password" 
                    name="password" 
                    class="login-input"
                    placeholder="비밀번호" 
                    required
                >

                <button type="submit" class="login-button">
                    로그인
                </button>
            </form>
        </section>
    </main>

</body>
</html>
